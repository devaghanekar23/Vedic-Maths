<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | VedicMath</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0f19; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 35px 30px; max-width: 420px; width: 100%; text-align: center; }
        input { width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px 15px; border-radius: 12px; outline: none; margin-bottom: 15px; }
        input:focus { border-color: #a855f7; }
        .btn-submit { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; width: 100%; padding: 12px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        a { color: #a78bfa; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2 class="mb-1">🔑 Forgot Password</h2>
        <p class="text-muted mb-4">Enter your email — we'll send a reset link</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-info">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email" placeholder="Enter your Email" required>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <div class="mt-3">
    <a href="{{ url_for('login') }}" 
       style="display: inline-block;
              padding: 8px 20px;
              border: 1px solid rgba(167, 139, 250, 0.5);
              border-radius: 20px;
              color: #a78bfa;
              text-decoration: none;
              font-size: 0.875rem;
              transition: all 0.3s ease;">
        ← Back to Login
    </a>
</div>
    </div>
</body>
</html>
