<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | VedicMath</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0b0f19; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 35px 30px; max-width: 420px; width: 100%; text-align: center; }
        .input-box { position: relative; margin-bottom: 15px; }
        .input-box i.lock { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .input-box i.eye { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; }
        input { width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px 45px; border-radius: 12px; outline: none; }
        input:focus { border-color: #a855f7; }
        .btn-submit { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; width: 100%; padding: 12px; border-radius: 30px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        a { color: #a78bfa; }
        .back-login-btn:hover {
            background: rgba(167, 139, 250, 0.1);
            border-color: #a78bfa;
        }
    </style>
</head>
<body>
    <div class="card-box">
        <h2 class="mb-1">🔒 Reset Password</h2>
        <p class="text-muted mb-4">Enter your new password</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-info">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-box">
                <i class="bi bi-lock lock"></i>
                <input type="password" name="password" id="newPassword"
                       placeholder="New Password" required>
                <i class="bi bi-eye-slash eye" id="toggleNew"></i>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <div class="mt-3">
            <a href="{{ url_for('login') }}" 
               style="display: inline-block;
                      padding: 8px 20px;
                      border: 1px solid rgba(167, 139, 250, 0.5);
                      border-radius: 20px;
                      color: #a78bfa;
                      text-decoration: none;
                      font-size: 0.875rem;
                      transition: all 0.3s ease;">
                ← Back to Login
            </a>
        </div>
    </div>

    <script>
        const toggleNew = document.getElementById('toggleNew');
        const newPassword = document.getElementById('newPassword');
        toggleNew.addEventListener('click', function () {
            if (newPassword.type === 'password') {
                newPassword.type = 'text';
                this.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                newPassword.type = 'password';
                this.classList.replace('bi-eye', 'bi-eye-slash');
            }
        });
    </script>
</body>
</html>
