<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VedicMath</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body.login-page {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 35px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .input-box input {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 12px 15px 12px 45px;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }

        .input-box input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .login-submit {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-submit:hover {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            opacity: 0.95;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            margin: 20px 0;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-google {
            background: #ffffff;
            color: #1e293b;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-google:hover {
            background: #f1f5f9;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .modal-content {
            background-color: #1e293b;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            color: #ffffff;
        }
    </style>
</head>

<body class="login-page">

    <!-- FLASH MESSAGE -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-message alert alert-info text-center">
        {% for message in messages %}
        {{ message }}
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="login-wrapper">
        <div class="login-card">

            <div class="logo-circle">
                🧮
            </div>

            <h2 class="fw-bold mb-1">Welcome Back</h2>
            <p class="subtitle text-muted mb-4">Login to continue learning Vedic Mathematics</p>

            <!-- STANDARD LOGIN FORM -->
            <form method="POST" action="{{ url_for('login') }}">
                <div class="input-box">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" placeholder="Enter Email" required>
                </div>

                <div class="input-box">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" id="passwordInput" 
                           placeholder="Enter Password" required
                           style="padding-right: 45px;">
                    <i class="bi bi-eye-slash" id="togglePassword"
                       style="position: absolute; right: 15px; top: 50%; 
                              transform: translateY(-50%); cursor: pointer; 
                              color: #94a3b8; font-size: 1.1rem; left: auto;">
                    </i>
                </div>

                <div class="text-end mb-2">
                    <a href="{{ url_for('forgot_password') }}" 
                       style="color: #a78bfa; font-size: 0.85rem; text-decoration: none;">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="login-submit">
                    Login
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- CONTINUE WITH GOOGLE -->
            <div class="d-flex justify-content-center">
                <div id="g_id_onload"
                    data-client_id="976524200976-9rkjn3etb9qgnvpp5vsvfo5v2uclqadb.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-width="300"></div>
            </div>

            <p style="margin-top:25px;" class="mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" style="color:#38bdf8; text-decoration:none;" class="fw-bold">
                    Register
                </a>
            </p>

            <a href="{{ url_for('home') }}" class="back-btn">
                ← Back Home
            </a>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

            togglePassword.addEventListener('click', function () {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.classList.remove('bi-eye-slash');
                    this.classList.add('bi-eye');
                } else {
                    passwordInput.type = 'password';
                    this.classList.remove('bi-eye');
                    this.classList.add('bi-eye-slash');
                }
            });
        async function handleGoogleLogin(response) {
            try {
                const res = await fetch('/google_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert("Login failed: " + (data.message || "Please try again."));
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Connection error during Google Login.");
            }
        }
    </script>

</body>

</html>
