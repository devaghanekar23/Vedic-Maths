<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Lens & Chat | Vedic Mathematics</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body.dashboard-page {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .dashboard-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-nav .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a855f7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            color: #cbd5e1;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-btn:hover {
            color: #ffffff;
        }

        .math-lens-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .lens-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .lens-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .subtitle-text {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Option Buttons Grid */
        .option-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px dashed rgba(168, 85, 247, 0.5);
            color: white;
            padding: 16px 12px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-option:hover {
            background: rgba(168, 85, 247, 0.12);
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .btn-option i {
            font-size: 1.8rem;
            color: #a855f7;
            display: block;
            margin-bottom: 6px;
        }

        .option-title {
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
        }

        .option-sub {
            font-size: 0.78rem;
            color: #64748b;
        }

        .preview-box {
            text-align: center;
            margin: 15px 0 20px;
            display: none;
            position: relative;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .remove-img-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        /* Input Box Styling */
        .chat-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        textarea.chat-textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 16px;
            padding: 15px 50px 15px 15px;
            outline: none;
            resize: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        textarea.chat-textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .chat-send-btn {
            position: absolute;
            right: 12px;
            bottom: 20px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        /* Response Box */
        .ai-chat-box {
            margin-top: 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .ai-chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .ai-chat-header i {
            font-size: 1.6rem;
            color: #a855f7;
        }

        .ai-chat-body {
            line-height: 1.7;
            font-size: 1.02rem;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        /* Loading Spinner */
        .loading-box {
            display: none;
            text-align: center;
            padding: 20px;
            color: #a855f7;
        }

        /* Modal Camera Elements */
        .modal-content {
            background-color: #1e293b;
            color: white;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #videoFeed {
            width: 100%;
            border-radius: 12px;
            background-color: #000;
        }
    </style>
</head>

<body class="dashboard-page">

    <!-- NAVBAR -->
    <nav class="dashboard-nav">
        <div class="logo">
            <i class="bi bi-robot"></i>
            <span>AI Math Lens & Chat</span>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('sutras_page') }}" class="nav-btn me-3">
                <i class="bi bi-book me-1"></i> Learn Sutras
            </a>
            <a href="{{ url_for('dashboard') }}" class="nav-btn">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="math-lens-container">

            <!-- HEADER TITLE -->
            <div class="lens-header">
                <div class="lens-icon">
                    <i class="bi bi-stars"></i>
                </div>
                <h2 class="fw-bold">ChatGPT AI Math Tutor</h2>
                <p class="subtitle-text">Ask any Maths question by typing or uploading an image!</p>
            </div>

            <!-- FORM CONTAINER -->
            <div class="lens-card">
                <form method="POST" action="{{ url_for('ai_scan') }}" enctype="multipart/form-data" id="mathForm" onsubmit="showLoading()">

                    <!-- OPTIONS: Live Camera OR File Upload -->
                    <div class="option-buttons">
                        <div class="btn-option" onclick="startCamera()">
                            <i class="bi bi-camera"></i>
                            <span class="option-title">Take Photo</span>
                            <span class="option-sub">Use Live Camera</span>
                        </div>

                        <label class="btn-option m-0">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <span class="option-title">Upload Image</span>
                            <span class="option-sub">Select from Gallery</span>
                            <input type="file" id="fileInput" name="image" accept="image/*" class="d-none">
                        </label>
                    </div>

                    <!-- Hidden Input for Camera Capture -->
                    <input type="hidden" name="camera_image" id="cameraImageData">

                    <!-- PREVIEW BOX -->
                    <div class="preview-box" id="previewBox">
                        <button type="button" class="remove-img-btn" onclick="clearSelectedImage()"><i class="bi bi-x"></i></button>
                        <img id="previewImg" src="#" alt="Selected Image">
                    </div>

                    <!-- TEXTAREA INPUT -->
                    <div class="chat-input-wrapper">
                        <textarea name="prompt" rows="3" class="chat-textarea" id="chatPrompt" placeholder="Type your maths question or problem here... (e.g. Solve 25² using Ekadhikena Purvena or Explain 98 x 97)"></textarea>
                        
                        <button type="submit" class="chat-send-btn" title="Send to AI">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>

                </form>

                <!-- LOADING SPINNER -->
                <div class="loading-box" id="loadingBox">
                    <div class="spinner-border text-primary mb-2" role="status"></div>
                    <p>AI is solving your problem... Please wait 🚀</p>
                </div>

                <!-- AI RESULT SECTION -->
                {% if result %}
                <div class="ai-chat-box">
                    <div class="ai-chat-header">
                        <i class="bi bi-robot"></i>
                        <h5 class="mb-0 fw-bold text-light">AI Solution & Step-by-Step Explanation</h5>
                    </div>
                    <div class="ai-chat-body">{{ result }}</div>
                </div>
                {% endif %}

            </div>

        </div>
    </div>

    <!-- LIVE CAMERA MODAL -->
    <div class="modal fade" id="cameraModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title"><i class="bi bi-camera me-2"></i>Capture Question</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="stopCamera()"></button>
                </div>
                <div class="modal-body">
                    <video id="videoFeed" autoplay playsinline></video>
                    <canvas id="canvas" class="d-none"></canvas>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal" onclick="stopCamera()">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" onclick="capturePhoto()">
                        <i class="bi bi-circle-fill me-1"></i> Capture
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const fileInput = document.getElementById("fileInput");
        const previewBox = document.getElementById("previewBox");
        const previewImg = document.getElementById("previewImg");
        const videoFeed = document.getElementById("videoFeed");
        const canvas = document.getElementById("canvas");
        const cameraImageData = document.getElementById("cameraImageData");
        let stream = null;
        let cameraModal = null;

        // 1. File Upload Preview Logic
        fileInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    previewBox.style.display = "block";
                    cameraImageData.value = ""; 
                }
                reader.readAsDataURL(file);
            }
        });

        // Clear Selected Image
        function clearSelectedImage() {
            fileInput.value = "";
            cameraImageData.value = "";
            previewBox.style.display = "none";
        }

        // 2. Start Camera (Live Feed)
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                videoFeed.srcObject = stream;
                
                cameraModal = new bootstrap.Modal(document.getElementById('cameraModal'));
                cameraModal.show();
            } catch (err) {
                alert("Please allow camera access!");
                console.error("Camera Error: ", err);
            }
        }

        // 3. Stop Camera Stream
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }

        // 4. Capture Photo from Live Camera
        function capturePhoto() {
            canvas.width = videoFeed.videoWidth;
            canvas.height = videoFeed.videoHeight;
            
            const context = canvas.getContext("2d");
            context.drawImage(videoFeed, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL("image/png");
            
            previewImg.src = dataUrl;
            previewBox.style.display = "block";
            cameraImageData.value = dataUrl;
            
            fileInput.value = ""; 

            stopCamera();
            cameraModal.hide();
        }

        // Show Loading Bar when submitting query
        function showLoading() {
            document.getElementById('loadingBox').style.display = 'block';
        }
    </script>

</body>

</html>
